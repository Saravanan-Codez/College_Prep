name: Release Cross-Platform Apps (Windows, Android, Linux, macOS)

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Non-macOS Rust Target
        if: matrix.platform != 'macos-latest'
        run: rustup target add ${{ matrix.target }}

      - name: Add macOS Universal Targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "release"

      - name: Install Linux Build Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Desktop Release Package via Tauri CLI
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            npx tauri build --target universal-apple-darwin
          else
            npx tauri build --target ${{ matrix.target }}
          fi

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          retention-days: 1
          path: |
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/dmg/*.dmg

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0"

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust Android Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "release"

      - name: Install Dependencies
        run: npm ci

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p src-tauri/gen/android
          echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/falkon_labs.keystore

      - name: Build Android Release APK & AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/src-tauri/gen/android/falkon_labs.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          export NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125
          npx tauri android build --apk
          npx tauri android build --aab

      - name: Verify Android Output Files
        run: find src-tauri/gen/android/app/build/outputs -type f

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-bundles
          retention-days: 1
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  publish-release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download All Compiled Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Organize & Preserve Release Binaries
        run: |
          mkdir -p final-assets
          find release-assets -type f -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              *.msi|*.exe|*.AppImage|*.deb|*.dmg|*.apk|*.aab)
                fname=$(basename "$f")
                cp "$f" "final-assets/EngiPrep_${{ github.event.release.tag_name || github.ref_name }}_${fname}"
                ;;
            esac
          done
          
          COUNT=$(find final-assets -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No release artifacts found!"
            exit 1
          fi
          
          echo "Found $COUNT release assets:"
          ls -la final-assets/

      - name: Generate Text & JSON Checksums
        run: |
          cd final-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const files = fs.readdirSync(".").filter(f => f !== "SHA256SUMS.txt" && f !== "SHA256SUMS.json");
            const result = {};
            for (const f of files) {
              const data = fs.readFileSync(f);
              result[f] = crypto.createHash("sha256").update(data).digest("hex");
            }
            fs.writeFileSync("SHA256SUMS.json", JSON.stringify(result, null, 2));
          '

      - name: Attach All Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: 'CS College Prep OS v${{ github.event.release.tag_name || github.ref_name }}'
          generate_release_notes: true
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}