name: Build Cross-Platform Apps (Windows, Android, Linux, macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun Dependencies
        run: bun install

      - name: Build Vite Svelte Bundle
        run: bun run build

      - name: Build Tauri Desktop Native App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'CS College Prep OS v__VERSION__'
          releaseBody: 'Cross-platform native release compiled automatically via GitHub Actions.'
          releaseDraft: true
          prerelease: false

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v1

      - name: Setup Rust Android Targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install Dependencies & Build Frontend
        run: |
          bun install
          bun run build

      - name: Build Android APK via Tauri
        run: |
          bun run tauri android init
          bun run tauri android build --apk
        continue-on-error: true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS-College-Prep-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/
