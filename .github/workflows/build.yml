name: Release Cross-Platform Apps (Windows, Android, Linux, macOS)

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform != 'macos-latest' && matrix.target || '' }}

      - name: Add macOS Universal Targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "release"

      - name: Install Linux Build Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Build Desktop Release Packages (Compilation Only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadToRelease: false
          args: ${{ matrix.target == 'universal-apple-darwin' && '--target universal-apple-darwin' || '' }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          retention-days: 1
          path: |
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/dmg/*.dmg

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0"

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust Android Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "release"

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Decode Android Keystore (If GitHub Secret Set)
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/falkon_labs.keystore

      - name: Build Android Release APK & AAB
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npx tauri android build --apk
          npx tauri android build --aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-bundles
          retention-days: 1
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  publish-release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download All Compiled Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organize & Rename Release Binaries with Friendly Names
        run: |
          mkdir -p final-assets
          find release-assets -type f -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              *.msi) cp "$f" final-assets/CollegePrepOS-Windows-x64.msi ;;
              *setup*.exe|*-setup.exe) cp "$f" final-assets/CollegePrepOS-Windows-x64-Setup.exe ;;
              *.exe) cp "$f" final-assets/CollegePrepOS-Windows-x64.exe ;;
              *.AppImage) cp "$f" final-assets/CollegePrepOS-Linux-x64.AppImage ;;
              *.deb) cp "$f" final-assets/CollegePrepOS-Linux-x64.deb ;;
              *.dmg) cp "$f" final-assets/CollegePrepOS-macOS-Universal.dmg ;;
              *.apk) cp "$f" final-assets/CollegePrepOS-Android.apk ;;
              *.aab) cp "$f" final-assets/CollegePrepOS-Android.aab ;;
            esac
          done
          
          COUNT=$(find final-assets -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No release artifacts found!"
            exit 1
          fi
          
          echo "Found $COUNT release assets:"
          ls -la final-assets/

      - name: Generate Checksums (SHA256SUMS.txt)
        run: |
          cd final-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach All Assets & Generated Release Notes to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: 'CS College Prep OS v${{ github.event.release.tag_name || github.ref_name }}'
          generate_release_notes: true
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
