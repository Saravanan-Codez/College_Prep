[package]
name = "cs-college-prep-os"
version = "2.0.0"
description = "Cross-platform offline-first 20-day preparation OS for Computer Science & Engineering students"
authors = ["Antigravity Developer"]
edition = "2021"

[lib]
name = "cs_college_prep_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
